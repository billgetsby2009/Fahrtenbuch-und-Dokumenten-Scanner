<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team-Fahrtenbuch</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; color: #1f2937; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { text-align: center; font-size: 24px; color: #1e3a8a; }
        h2 { font-size: 18px; margin-top: 0; border-bottom: 2px solid #f3f4f6; padding-bottom: 8px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .stat { background: #eff6ff; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-val { font-size: 22px; font-weight: bold; color: #2563eb; }
        .stat-lbl { font-size: 12px; color: #6b7280; }
        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; font-size: 16px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-start { background-color: #2563eb; color: white; }
        .btn-stop { background-color: #dc2626; color: white; }
        .btn-csv { background-color: #10b981; color: white; margin-top: 10px; }
        .log-list { list-style: none; padding: 0; margin: 0; max-height: 200px; overflow-y: auto; }
        .log-item { padding: 10px; border-bottom: 1px solid #e5e7eb; font-size: 13px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <h1>🚗 Team-Fahrtenbuch</h1>

    <!-- GPS TRACKER -->
    <div class="card">
        <h2>📍 GPS-Fahrtenaufzeichnung</h2>
        <div class="grid">
            <div class="stat">
                <div class="stat-val" id="km-display">0.00</div>
                <div class="stat-lbl">Gefahrene KM</div>
            </div>
            <div class="stat">
                <div class="stat-val" id="eur-display">0.00 €</div>
                <div class="stat-lbl">Erstattung (0,30€)</div>
            </div>
        </div>

        <label for="ziel">Ziel der Fahrt *</label>
        <input type="text" id="ziel" placeholder="z.B. Kunde Müller, Hamburg">

        <label for="zweck">Zweck der Fahrt *</label>
        <input type="text" id="zweck" placeholder="z.B. Projektabsprache">

        <button id="track-btn" class="btn-start" onclick="toggleTracking()">Fahrt starten</button>
    </div>

    <!-- EXPORT & HISTORIE -->
    <div class="card">
        <h2>📊 Daten-Export (CSV)</h2>
        <button class="btn-csv" onclick="exportFahrten()">Fahrtenbuch herunterladen (.csv)</button>
        
        <h3 style="font-size:14px; margin-top:20px;">Letzte Fahrten:</h3>
        <ul id="fahrten-log" class="log-list"></ul>
    </div>

    <script>
        let isTracking = false;
        let watchId = null;
        let totalDistance = 0; // in Kilometern
        let lastPosition = null;
        let fahrtenSpeicher = JSON.parse(localStorage.getItem('fahrten')) || [];

        // Distanzberechnung zwischen zwei GPS-Punkten (Haversine-Formel)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Erdradius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function updateDisplays() {
            document.getElementById('km-display').innerText = totalDistance.toFixed(2);
            document.getElementById('eur-display').innerText = (totalDistance * 0.3).toFixed(2) + " €";
        }

        function toggleTracking() {
            const zielInput = document.getElementById('ziel');
            const zweckInput = document.getElementById('zweck');

            if (!isTracking) {
                // Validierung der Pflichtfelder
                if (!zielInput.value.trim() || !zweckInput.value.trim()) {
                    alert("Bitte trage zuerst das Ziel und den Zweck der Fahrt ein!");
                    return;
                }

                if (!navigator.geolocation) {
                    alert("Dein Smartphone unterstützt kein GPS-Tracking im Browser.");
                    return;
                }

                isTracking = true;
                totalDistance = 0;
                lastPosition = null;
                updateDisplays();

                document.getElementById('track-btn').innerText = "Fahrt stoppen";
                document.getElementById('track-btn').className = "btn-stop";

                // Live-Standortüberwachung starten
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const { latitude, longitude, accuracy } = position.coords;
                        
                        // Schlechte GPS-Signale ignorieren (Ungenauigkeit > 30 Meter)
                        if (accuracy > 30) return; 

                        if (lastPosition) {
                            const diff = calculateDistance(
                                lastPosition.latitude, lastPosition.longitude,
                                latitude, longitude
                            );
                            // Nur Bewegung werten, die realistisch ist (> 10 Meter)
                            if (diff > 0.01) {
                                totalDistance += diff;
                                updateDisplays();
                            }
                        }
                        lastPosition = { latitude, longitude };
                    },
                    (error) => {
                        console.error(error);
                        alert("GPS-Fehler: Bitte aktiviere die Ortungsdienste auf deinem Handy.");
                    },
                    { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
                );

            } else {
                // Tracking stoppen
                isTracking = false;
                navigator.geolocation.clearWatch(watchId);

                // Daten speichern
                const neueFahrt = {
                    datum: new Date().toLocaleDateString('de-DE'),
                    ziel: zielInput.value,
                    zweck: zweckInput.value,
                    km: totalDistance.toFixed(2),
                    euro: (totalDistance * 0.3).toFixed(2)
                };

                fahrtenSpeicher.push(neueFahrt);
                localStorage.setItem('fahrten', JSON.stringify(fahrtenSpeicher));

                // Inputs zurücksetzen
                zielInput.value = "";
                zweckInput.value = "";
                document.getElementById('track-btn').innerText = "Fahrt starten";
                document.getElementById('track-btn').className = "btn-start";

                renderLog();
                alert("Fahrt erfolgreich gespeichert!");
            }
        }

        function renderLog() {
            const list = document.getElementById('fahrten-log');
            list.innerHTML = "";
            fahrtenSpeicher.slice().reverse().forEach(f => {
                const li = document.createElement('li');
                li.className = "log-item";
                li.innerHTML = `<span><b>${f.datum}</b> - ${f.ziel} (${f.zweck})</span> <span>${f.km} km (${f.euro} €)</span>`;
                list.appendChild(li);
            });
        }

        function exportFahrten() {
            if (fahrtenSpeicher.length === 0) {
                alert("Keine Fahrten zum Exportieren vorhanden.");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,Datum,Ziel,Zweck,Kilometer,Erstattung_EUR\n";
            fahrtenSpeicher.forEach(f => {
                csvContent += `"${f.datum}","${f.ziel}","${f.zweck}","${f.km}","${f.euro}"\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `fahrtenbuch_export.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Beim Start gelaufene Fahrten laden
        renderLog();
    </script>
</body>
</html>
